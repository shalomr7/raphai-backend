# render.yaml - tells Render how to run the HeartPurse backend (a "Blueprint").
# In Render: New + -> Blueprint -> pick your GitHub repo. Render reads this file.
services:
  - type: web
    name: raphai-backend
    runtime: node
    region: singapore        # closest Render region to India
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health-check
    envVars:
      # Your Supabase connection string. Render asks you to paste it
      # when you create the Blueprint (use the "Session pooler" string).
      - key: DATABASE_URL
        sync: false
      # A long random secret for login tokens. Render makes one for you.
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: APP_TZ
        value: Asia/Kolkata
      # CORS_ORIGIN: leave unset (the Android app does not need CORS; "*" is ignored in production)
      - key: NODE_VERSION
        value: "22"
      # Password-reset email via Resend. Unset = /api/auth/forgot returns 503 email_unavailable.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM   # e.g. HeartPurse <no-reply@yourdomain.com> (verified in Resend)
        sync: false
      # Owner admin dashboard (/admin). See docs/ADMIN.md.
      - key: ADMIN_EMAILS
        value: rooppashalemraju@gmail.com
      - key: ADMIN_PASSWORD_HASH   # bcrypt hash of the extra admin password
        sync: false
      # Gemini (server only). Unset = rule-based coach.
      - key: GEMINI_API_KEY
        sync: false
      # ---- Google Play Billing (subscriptions) ----
      # The service-account key JSON (paste the whole file, or the file as base64).
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: com.raphai.app
      # Long random text. The Pub/Sub push URL must end with ?secret=<this value>
      - key: GOOGLE_RTDN_SECRET
        sync: false
      # Optional: turn on Pub/Sub signed-token checking (set both, or leave empty)
      - key: GOOGLE_RTDN_AUDIENCE
        sync: false
      - key: GOOGLE_RTDN_SERVICE_ACCOUNT_EMAIL
        sync: false
